<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Turkey 2026 public mobile-first travel dashboard for itinerary, flights, weather, places, and notes."
    />
    <title>Turkey 2026 Travel Dashboard Public</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="Trip overview">
        <div>
          <p class="eyebrow">Personal Trip</p>
          <h1>Turkey 2026</h1>
          <p class="date-range">2026/09/22 - 2026/10/01</p>
        </div>
        <div class="countdown-pill" id="countdownPill">--</div>
      </header>

      <main>
        <section class="view is-active" id="todayView" aria-labelledby="todayTitle">
          <div class="hero-panel">
            <div class="hero-copy">
              <p class="eyebrow">Next Stop</p>
              <h2 id="todayTitle">準備出發</h2>
              <p id="todaySubtitle">Loading trip status...</p>
            </div>
            <div class="city-card" id="cityProgress"></div>
          </div>

          <section class="weather-card" aria-labelledby="weatherTitle">
            <div>
              <p class="eyebrow">Weather</p>
              <h3 id="weatherTitle">旅途中城市天氣</h3>
            </div>
            <div class="weather-grid" id="weatherGrid">
              <div class="metric-card">
                <span class="metric-label">狀態</span>
                <strong>載入中</strong>
              </div>
            </div>
          </section>

          <section class="content-section" aria-labelledby="nextItemTitle">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Up Next</p>
                <h3 id="nextItemTitle">下一個行程</h3>
              </div>
            </div>
            <div id="nextItem"></div>
          </section>

          <section class="content-section" aria-labelledby="todayTimelineTitle">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Timeline</p>
                <h3 id="todayTimelineTitle">今日時間軸</h3>
              </div>
            </div>
            <div class="timeline" id="todayTimeline"></div>
          </section>
        </section>

        <section class="view" id="tripView" aria-labelledby="tripTitle">
          <div class="page-heading">
            <p class="eyebrow">Itinerary</p>
            <h2 id="tripTitle">每日行程</h2>
          </div>
          <div class="date-tabs" id="dateTabs" role="tablist" aria-label="Trip dates"></div>
          <div class="timeline" id="tripTimeline"></div>
        </section>

        <section class="view" id="flightsView" aria-labelledby="flightsTitle">
          <div class="page-heading">
            <p class="eyebrow">Flights</p>
            <h2 id="flightsTitle">航班資訊</h2>
          </div>
          <div class="flight-list" id="flightList"></div>
        </section>

        <section class="view" id="placesView" aria-labelledby="placesTitle">
          <div class="page-heading">
            <p class="eyebrow">Places</p>
          <h2 id="placesTitle">推薦行程 / Recommended Plans</h2>
          </div>
          <div class="place-grid" id="placeGrid"></div>
        </section>

        <section class="view" id="moreView" aria-labelledby="moreTitle">
          <div class="page-heading">
            <p class="eyebrow">More</p>
            <h2 id="moreTitle">旅行工具</h2>
          </div>
          <div class="tool-grid" id="toolGrid"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item is-active" data-view="todayView" type="button">Today</button>
        <button class="nav-item" data-view="tripView" type="button">Trip</button>
        <button class="nav-item" data-view="flightsView" type="button">Flights</button>
        <button class="nav-item" data-view="placesView" type="button">Places</button>
        <button class="nav-item" data-view="moreView" type="button">More</button>
      </nav>
    </div>

    <script type="module" src="./app.public.js?v=20260922-daily-plans"></script>
  </body>
</html>
